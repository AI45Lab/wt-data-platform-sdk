[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-data-platform-sdk"
version = "0.1.1"
description = "Wind Tunnel Data Platform SDK"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
keywords = ["sdk", "data-platform", "etl", "ingestion", "search"]
authors = [
    {name = "Wind Tunnel Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dldb @ git+https://github.com/DeepLink-org/Persisting.git@dldb-v1.0.0#subdirectory=persisting/dldb",
    "pydantic>=2.5.0",
    "loguru>=0.7.2",
    "pandas>=2.3.3",
    "s3fs>=2024.0.0",
    "boto3>=1.34.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/AI45Lab/wt-data-platform-sdk"
Repository = "https://github.com/AI45Lab/wt-data-platform-sdk"
"Bug Tracker" = "https://github.com/AI45Lab/wt-data-platform-sdk/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["wt_sdk*"]
exclude = ["wt_data_platform_sdk.egg-info*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: requires a configured DLDB/S3 environment and may write test tables",
]
